name: windows-tests

# The unit tests of the data and the logic (Chronikologio.Core.Tests) on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ChronNet: "10.0"   # the workflows stay on the .NET 10 SDK of the runners until .NET 11 is offered there

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test tests/Chronikologio.Core.Tests --nologo

      - name: Vulnerable packages (warning only)
        shell: pwsh
        continue-on-error: true
        run: |
          $out = dotnet list src/Chronikologio.UI package --vulnerable --include-transitive | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') { Write-Warning 'Vulnerable packages found' }

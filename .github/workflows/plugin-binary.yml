name: Chronikologio 1.0.0.0 plugin binary
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin-binary:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run plugin DLL version and shared contract regression tests
        shell: pwsh
        run: |
          dotnet test tests/Chronikologio.Plugin.Tests/Chronikologio.Plugin.Tests.csproj -c Release -m:1 --nologo --filter FullyQualifiedName~PluginDllVersionTests
          if ($LASTEXITCODE -ne 0) { throw 'DLL version and contract tests failed' }
      - name: Publish plugin and confirm assembly + file versions
        shell: pwsh
        run: |
          dotnet publish src/Chronikologio.OpsisPlugin/Chronikologio.OpsisPlugin.csproj -c Release -m:1 --nologo -o publish-plugin
          if ($LASTEXITCODE -ne 0) { throw 'Plugin publish failed' }
          $dll = (Resolve-Path 'publish-plugin/Chronikologio.OpsisPlugin.dll').Path
          $a = [Reflection.AssemblyName]::GetAssemblyName($dll)
          $fv = [Diagnostics.FileVersionInfo]::GetVersionInfo($dll).FileVersion
          if ($a.Version.ToString() -ne '1.0.0.0' -or $fv -ne '1.0.0.0') { throw "Plugin DLL version mismatch ($($a.Version), $fv)" }
          $contract = (Resolve-Path 'libs/OpsisNewsCrawler.Plugin.Abstractions.dll').Path
          if ([Reflection.AssemblyName]::GetAssemblyName($contract).Version.ToString() -ne '0.8.0.0') { throw 'Shared contract ABI changed' }
          'Chronikologio Plugin DLL = 1.0.0.0; shared contract ABI = 0.8.0.0'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chronikologio-plugin-dll-1.0.0.0
          path: publish-plugin/
          if-no-files-found: error
          retention-days: 14
